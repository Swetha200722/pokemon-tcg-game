<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Golden TCG</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
        radial-gradient(circle at 50% 40%,#4b350d 0%,#171007 35%,#050403 80%);
    color:#fff;
    font-family:'Rajdhani',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

/* HEADER */

header{
    height:72px;
    background:linear-gradient(90deg,#090704,#211708,#090704);
    border-bottom:2px solid #d4af37;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    box-shadow:0 0 25px rgba(212,175,55,.35);
}

.logo{
    font-family:'Orbitron',sans-serif;
    font-size:22px;
    font-weight:900;
    color:#ffd700;
    letter-spacing:2px;
}

.logo span{
    color:#fff1a8;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.profile img{
    width:45px;
    height:45px;
    border-radius:50%;
    border:2px solid #ffd700;
}

.coins{
    color:#ffd700;
    font-weight:bold;
    font-size:18px;
}

/* MAIN */

.game{
    width:96%;
    max-width:1500px;
    margin:15px auto;
}

/* OPPONENT */

.opponent{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,.45);
    border:1px solid #725713;
    border-radius:14px;
    padding:10px 18px;
}

.player{
    display:flex;
    align-items:center;
    gap:12px;
}

.player img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid #d4af37;
}

.name{
    font-family:'Orbitron';
    color:#ffd700;
}

.hp{
    color:#ff6969;
    font-weight:bold;
}

/* ARENA */

.arena{
    margin-top:12px;
    min-height:420px;
    position:relative;
    border:2px solid #9c7921;
    border-radius:22px;
    background:
        radial-gradient(circle,#5b4212 0%,#1b1206 45%,#090705 100%);
    box-shadow:
        inset 0 0 70px rgba(255,215,0,.15),
        0 0 30px rgba(212,175,55,.2);
    overflow:hidden;
}

.arena:before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    border:1px solid rgba(255,215,0,.15);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* PRIZE */

.prizes{
    position:absolute;
    top:15px;
    left:18px;
}

.prizes h4{
    color:#ffd700;
    margin-bottom:6px;
}

.prizecards{
    display:flex;
    gap:5px;
}

.prizecards div{
    width:35px;
    height:48px;
    background:linear-gradient(145deg,#fff1a8,#b88918);
    border:2px solid #ffd700;
    border-radius:5px;
    box-shadow:0 0 10px rgba(255,215,0,.4);
}

/* ACTIVE */

.active{
    position:absolute;
    left:50%;
    top:53%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.active-card{
    width:190px;
    height:250px;
    border:3px solid #ffd700;
    border-radius:16px;
    padding:8px;
    background:
        linear-gradient(145deg,#32230a,#080704);
    box-shadow:
        0 0 20px rgba(255,215,0,.5),
        0 0 60px rgba(255,215,0,.15);
    transition:.3s;
}

.active-card:hover{
    transform:scale(1.05);
    box-shadow:
        0 0 30px #ffd700,
        0 0 70px rgba(255,215,0,.4);
}

.active-card img{
    width:100%;
    height:175px;
    object-fit:contain;
}

.card-name{
    font-family:'Orbitron';
    color:#ffd700;
    font-size:18px;
}

.active-hp{
    margin-top:5px;
    height:8px;
    background:#301010;
    border-radius:10px;
    overflow:hidden;
}

.active-hp span{
    display:block;
    width:85%;
    height:100%;
    background:linear-gradient(90deg,#ffd700,#fff3a3);
}

/* BENCH */

.bench{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
}

.bench-card{
    width:75px;
    height:75px;
    background:#151006;
    border:1px solid #b58b25;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.25s;
}

.bench-card:hover{
    transform:translateY(-12px) scale(1.1);
    border-color:#ffd700;
    box-shadow:0 0 20px #ffd700;
}

.bench-card img{
    width:65px;
    height:65px;
    object-fit:contain;
}

/* COMMAND */

.command{
    position:absolute;
    right:20px;
    bottom:20px;
    width:230px;
    background:rgba(8,6,3,.9);
    border:1px solid #d4af37;
    border-radius:14px;
    padding:15px;
    box-shadow:0 0 20px rgba(212,175,55,.2);
}

.command h3{
    color:#ffd700;
    font-family:'Orbitron';
    margin-bottom:10px;
}

.attack{
    padding:10px;
    margin:6px 0;
    border:1px solid #705718;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

.attack:hover{
    background:#5b4212;
    border-color:#ffd700;
    transform:translateX(-4px);
}

.end{
    width:100%;
    margin-top:8px;
    padding:11px;
    background:linear-gradient(90deg,#a57912,#ffd700,#a57912);
    border:0;
    border-radius:8px;
    font-family:'Orbitron';
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   HAND - NO SPACING
========================= */

.hand-section{
    margin-top:10px;
    text-align:center;
}

.hand-title{
    color:#ffd700;
    font-family:'Orbitron';
    font-size:15px;
    margin-bottom:4px;
}

/* MAIN HAND */

.hand{
    height:185px;
    display:flex;
    justify-content:center;
    align-items:flex-end;

    /* IMPORTANT */
    gap:0;

    padding:5px 10px;
    overflow:visible;
}

/* CARD */

.hand .card{
    width:115px;
    height:160px;

    /* overlap */
    margin-left:-12px;

    flex-shrink:0;

    border:2px solid #d4af37;
    border-radius:12px;

    background:#100c06;

    cursor:pointer;

    position:relative;

    box-shadow:
        0 5px 15px rgba(0,0,0,.8),
        0 0 7px rgba(255,215,0,.2);

    transition:
        transform .25s ease,
        margin .25s ease,
        box-shadow .25s ease;
}

/* first card */

.hand .card:first-child{
    margin-left:0;
}

/* CARD IMAGE */

.hand .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:10px;
}

/* HOVER / PICK */

.hand .card:hover{
    transform:translateY(-30px) scale(1.08);

    margin-right:8px;

    z-index:50;

    border-color:#fff1a8;

    box-shadow:
        0 18px 35px rgba(0,0,0,.9),
        0 0 25px #ffd700,
        0 0 50px rgba(255,215,0,.45);
}

/* SELECTED */

.hand .card.selected{
    transform:translateY(-38px) scale(1.1);

    z-index:100;

    border:3px solid #fff1a8;

    box-shadow:
        0 20px 40px rgba(0,0,0,.95),
        0 0 30px #ffd700,
        0 0 65px rgba(255,215,0,.55);
}

/* CARD LABEL */

.card-label{
    position:absolute;
    bottom:6px;
    left:6px;
    right:6px;
    text-align:center;
    background:rgba(0,0,0,.75);
    color:#ffd700;
    border-radius:5px;
    padding:2px;
    font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:900px){

    .command{
        width:190px;
    }

    .hand .card{
        width:90px;
        height:125px;
        margin-left:-15px;
    }

    .hand{
        height:150px;
    }

}

@media(max-width:600px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:15px;
    }

    .command{
        display:none;
    }

    .arena{
        min-height:390px;
    }

    .hand{
        justify-content:flex-start;
        overflow-x:auto;
        padding-left:20px;
    }

    .hand .card{
        width:85px;
        height:120px;
        margin-left:-13px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        POKÉMON <span>GOLDEN TCG</span>
    </div>

    <div class="profile">
        <div class="coins">◈ 12,450</div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png">
    </div>

</header>


<div class="game">

<!-- OPPONENT -->

<div class="opponent">

    <div class="player">

        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png">

        <div>
            <div class="name">RIVAL TRAINER</div>
            <div class="hp">HP 180 / 180</div>
        </div>

    </div>

    <div style="color:#ffd700;font-family:Orbitron;">
        OPPONENT TURN
    </div>

</div>


<!-- ARENA -->

<div class="arena">

    <!-- PRIZES -->

    <div class="prizes">

        <h4>PRIZE CARDS</h4>

        <div class="prizecards">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>

    </div>


    <!-- ACTIVE -->

    <div class="active">

        <div class="active-card">

            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png">

            <div class="card-name">GENGAR V</div>

            <div class="active-hp">
                <span></span>
            </div>

            <small>HP 190 / 190</small>

        </div>

    </div>


    <!-- BENCH -->

    <div class="bench">

        <div class="bench-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png">
        </div>

        <div class="bench-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png">
        </div>

        <div class="bench-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png">
        </div>

        <div class="bench-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/149.png">
        </div>

        <div class="bench-card">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png">
        </div>

    </div>


    <!-- COMMAND -->

    <div class="command">

        <h3>⚡ ATTACK</h3>

        <div class="attack" onclick="attack('Shadow Ball')">
            🟣 Shadow Ball
            <b> 90 DMG</b>
        </div>

        <div class="attack" onclick="attack('Dark Pulse')">
            🟣 Dark Pulse
            <b> 120 DMG</b>
        </div>

        <button class="end" onclick="endTurn()">
            END TURN
        </button>

    </div>

</div>


<!-- HAND -->

<div class="hand-section">

    <div class="hand-title">
        YOUR HAND — PICK A CARD
    </div>

    <div class="hand">

        <div class="card" onclick="pickCard(this)">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png">
            <div class="card-label">PIKACHU</div>
        </div>

        <div class="card" onclick="pickCard(this)">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png">
            <div class="card-label">CHARIZARD</div>
        </div>

        <div class="card" onclick="pickCard(this)">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png">
            <div class="card-label">EEVEE</div>
        </div>

        <div class="card" onclick="pickCard(this)">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/149.png">
            <div class="card-label">DRAGONITE</div>
        </div>

        <div class="card" onclick="pickCard(this)">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png">
            <div class="card-label">MEWTWO</div>
        </div>

        <div class="card" onclick="pickCard(this)">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/143.png">
            <div class="card-label">SNORLAX</div>
        </div>

        <div class="card" onclick="pickCard(this)">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/131.png">
            <div class="card-label">LAPRAS</div>
        </div>

    </div>

</div>

</div>


<script>

/* PICK CARD */

function pickCard(card){

    document.querySelectorAll(".hand .card")
    .forEach(c => c.classList.remove("selected"));

    card.classList.add("selected");

}


/* ATTACK */

function attack(name){

    alert("⚡ " + name + " activated!");

}


/* END TURN */

function endTurn(){

    alert("🔄 Turn Ended!");

}

</script>

</body>
</html>
